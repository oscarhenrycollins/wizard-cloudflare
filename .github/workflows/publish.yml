name: Publish catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [wizard.md, runtipi/**, skill/**, .github/workflows/publish.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML
      - run: python tools/verify_image.py
      - run: |
          curl -sS --fail-with-body -X POST https://apps.aiwizards.com/v1/publish \
            -H 'content-type: application/json' -d '{"repo":"${{ github.repository }}"}'
      - run: |
          python - <<'PY'
          import json, os, urllib.request
          req=urllib.request.Request('https://apps.aiwizards.com/v1/apps/'+os.environ['GITHUB_REPOSITORY'],headers={'User-Agent':'wizard-cloudflare-release/1'})
          data=json.load(urllib.request.urlopen(req))
          print(json.dumps(data))
          PY
